version: '3.8'

services:
  db_postgres:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=siikli
      - POSTGRES_USER=siikli
      - POSTGRES_PASSWORD=testpassword
    ports:
      - '5432:5432'
    volumes:
      - db_postgres:/var/lib/postgresql/data
    networks:
      - siikli

volumes:
  db_postgres:

networks:
  siikli:
    driver: bridge
