version: '3.8'

services:
  db_mysql:
    image: mysql:8.0.28
    platform: linux/amd64
    restart: always
    environment:
      - MYSQL_DATABASE=siikli
      - MYSQL_USER=juulia
      - MYSQL_PASSWORD=testpassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - '3306:3306'
    volumes:
      - db_mysql:/var/lib/mysql
    networks:
      - juulia

  redis:
    image: redis:latest
    command: ['redis-server', '/etc/redis/redis.conf']
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf

volumes:
  db_mysql:
    driver: local
  redis_data:

networks:
  juulia:
    driver: bridge
