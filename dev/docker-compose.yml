services:
  db_postgres:
    image: postgres:17
    container_name: siikli_db_postgres
    restart: always
    environment:
      - POSTGRES_DB=siikli
      - POSTGRES_USER=siikli
      - POSTGRES_PASSWORD=testpassword
    ports:
      - '5432:5432'
    volumes:
      - db_postgres:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: siikli_redis
    command: [redis-server, /etc/redis/redis.conf]
    ports:
      - 6381:6379
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf

volumes:
  db_postgres:
    name: siikli_db_postgres_data
  redis_data:
    name: siikli_redis_data
